<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAHEM v10 - مصلح</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:#0a1930;color:#fff}.nav{max-width:1100px;margin:auto;background:#fff;border-radius:999px;display:flex;justify-content:space-between;padding:10px 18px;color:#0a1930}.grid{background:#0a1930}.h1{font-size:42px;font-weight:900;text-align:center}.h1 b{color:#ff8c32}.badge{border:1px solid #ffffff30;border-radius:999px;padding:6px 14px;font-size:12px;display:inline-block;margin-bottom:14px;color:#cbd5e1}.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;max-width:720px;margin:20px auto}.card{border:1px solid #ffffff25;border-radius:18px;padding:18px;background:#ffffff0a;text-align:center}.btn{border-radius:999px;padding:12px 20px;font-weight:800;border:1px solid #ffffff30;cursor:pointer}.orange{background:#ff8c32;color:#fff}.whitebox{background:#f8f5f0;color:#0a1930;min-height:100vh;padding:18px}.upbox{max-width:760px;margin:14px auto;background:#fff;border-radius:20px;padding:16px;text-align:center;border:1px solid #e2e8f0}.up{border:2px dashed #ff8c32;background:#fff7ed;border-radius:14px;padding:20px;display:block;font-weight:800}.step{background:#fff;border-radius:14px;padding:14px;margin:8px 0;display:flex;gap:12px;align-items:center;border:1px solid #eee}.num{background:#0a1930;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}.m{padding:12px;border-radius:12px;margin:8px 0;font-size:14px;text-align:right}.m.ai{background:#f1f5f9;color:#0a1930}.m.u{background:#0a1930;color:#fff}.chatBox{max-width:760px;margin:18px auto;background:#fff;border-radius:18px;padding:12px;border:1px solid #e2e8f0}.chatInput{display:flex;gap:6px;border:1px solid #ddd;border-radius:999px;padding:6px}.chatInput input{flex:1;border:0;outline:0;text-align:right;padding:6px}.pay{position:fixed;inset:0;background:rgba(10,25,48,.96);z-index:200;display:none;align-items:center;justify-content:center;padding:12px}.pay.open{display:flex}.paycard{background:#fff;border-radius:18px;padding:18px;margin:10px 0;color:#0a1930}.btn-green{background:#22c55e;color:#fff;border:0;border-radius:12px;padding:12px;width:100%;font-weight:800}.btn-blue{background:#2563eb;color:#fff;border:0;border-radius:12px;padding:12px;width:100%;font-weight:800}.inp{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;text-align:center;margin-top:8px}.loginBox{max-width:760px;margin:20px auto;background:#fff;border-radius:20px;padding:20px;text-align:center;border:2px solid #ff8c32}</style></head><body><div class="grid"><div style="padding:10px"><div class="nav"><div>FAHEM PLAN v10</div><div id="userInfo" style="font-size:11px"></div></div></div><div style="text-align:center;padding:30px 16px"><div class="badge">v10 - مصلح بلا ما فهمتش</div><div class="h1">البلان ولّى<br><b>ساهل</b> تفهمو</div><p style="max-width:560px;margin:16px auto;color:#cbd5e1">صوّر البلان، فاهم بلان يشرح ليك كل بيت بصوت وبالدارجة.</p></div></div><div class="whitebox"><div id="loginView" class="loginBox"><h2>🔐 دخل بجيمايل - 20 رسالة فابور</h2><p style="color:#64748b;font-size:13px;margin:8px 0">أي جيمايل كيدخل - كل واحد عندو 20 بوحدو</p><input id="emailInput" placeholder="imad@gmail.com" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;text-align:center"><button onclick="loginWithEmail()" style="margin-top:10px;background:#0a1930;color:#fff;border:0;border-radius:10px;padding:12px;width:100%;font-weight:800">✅ دخول بجيمايل</button></div><div id="uploadView" style="display:none"><h2 style="text-align:center;font-weight:900">صوّر البلان ديالك</h2><div style="text-align:center;margin:6px"><span id="welcome" style="background:#dcfce7;color:#166534;border-radius:999px;padding:4px 12px;font-size:12px"></span> <button onclick="logout()" style="border-radius:999px;padding:4px 8px">خروج</button></div><div class="upbox"><label class="up" for="f">📷 صوّر بالكاميرا ولا رفع صورة</label><input type="file" id="f" accept="image/*" hidden onchange="handle(this)"><div style="margin-top:12px"><button class="btn orange" onclick="document.getElementById('f').click()">📷 صوّر بالكاميرا</button> <button class="btn" onclick="document.getElementById('f').click()">🖼️ رفع صورة</button></div><div id="cnt" style="margin-top:10px;color:#64748b;font-size:13px"></div><div id="msgs"></div></div></div></div><div id="resultView" style="display:none;background:#f8f5f0;color:#0a1930;min-height:100vh;padding:18px"><div style="display:flex;justify-content:space-between;max-width:760px;margin:auto"><button onclick="goHome()" style="border-radius:999px;padding:6px 12px">→ رجوع</button></div><h2 id="resTitle" style="text-align:center;font-size:26px;font-weight:900;margin:14px"></h2><div style="max-width:760px;margin:auto;background:#fff;border-radius:16px;padding:8px"><img id="planPreview" style="width:100%;border-radius:12px"></div><div id="stepsList" style="max-width:760px;margin:auto"></div><div class="chatBox"><h3>💬 دردش مع البلان</h3><div id="chatMsgs"></div><div class="chatInput" style="margin-top:10px"><button onclick="startVoice()" style="border-radius:50%;width:36px;height:36px">🎙️</button><input id="qInput" placeholder="سلم؟ فين الصالون؟ فين الكوزينة؟" onkeydown="if(event.key==='Enter')ask()"><button onclick="ask()" style="background:#ff8c32;color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:800">إرسال</button></div></div></div><div id="pay" class="pay"><div style="max-width:380px;width:100%"><div class="paycard" style="text-align:center"><b>كملتي 20 سؤال! 🎉</b><p>خلص 20 درهم باش تكمل 1000</p><button class="btn-green" onclick="window.open('https://wa.me/212647205383?text=بغيت نفعل - '+localStorage.getItem('fb_email'),'_blank')">💬 واتساب 0647205383</button></div><div class="paycard" style="text-align:center"><b>عندي كود</b><input id="codeInput" class="inp" placeholder="الكود"><button class="btn-blue" style="margin-top:10px" onclick="activate()">✅ تفعيل</button></div><center><button onclick="document.getElementById('pay').classList.remove('open')" style="color:#fff;background:none;border:0;margin-top:10px">إغلاق</button></center></div></div><script>
let currentEmail=localStorage.getItem('fb_email')||"";
function getUsed(){return parseInt(localStorage.getItem('fb_used_'+currentEmail)||'0')}
function setUsed(v){localStorage.setItem('fb_used_'+currentEmail,v);upd()}
function isPro(){return localStorage.getItem('fb_pro_'+currentEmail)=='1'}
function upd(){let e=document.getElementById('cnt');let w=document.getElementById('welcome');let u=document.getElementById('userInfo');let used=getUsed();if(e)e.innerText=currentEmail?`مرحبا ${currentEmail} - باقي ${20-used}/20`:`باقي 20/20`;if(w)w.innerText=currentEmail?`${currentEmail} - ${20-used}`:"";if(u)u.innerText=currentEmail?currentEmail:""}
function checkLogin(){currentEmail=localStorage.getItem('fb_email')||"";if(currentEmail){document.getElementById('loginView').style.display='none';document.getElementById('uploadView').style.display='block';upd()}else{document.getElementById('loginView').style.display='block';document.getElementById('uploadView').style.display='none'}}checkLogin();
function loginWithEmail(){let e=document.getElementById('emailInput').value.trim().toLowerCase();if(!e.includes('@')||!e.includes('.')){alert('كتب جيمايل صحيح');return}localStorage.setItem('fb_email',e);currentEmail=e;if(!localStorage.getItem('fb_used_'+e))localStorage.setItem('fb_used_'+e,'0');checkLogin();upd();alert('✅ مرحبا '+e+' عندك 20 رسالة!')}
function logout(){localStorage.removeItem('fb_email');currentEmail="";checkLogin()}
function goHome(){document.getElementById('resultView').style.display='none';document.getElementById('uploadView').style.display='block'}
function speakText(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-MA';u.rate=0.9;speechSynthesis.speak(u)}
function startVoice(){let Rec=window.webkitSpeechRecognition||window.SpeechRecognition;let r=new Rec();r.lang='ar-MA';r.onresult=e=>{document.getElementById('qInput').value=e.results[0][0].transcript;ask()};r.start()}
function activate(){let c=document.getElementById('codeInput').value.trim();if(c.length>3){localStorage.setItem('fb_pro_'+currentEmail,'1');localStorage.setItem('fb_used_'+currentEmail,'0');alert('✅ تم التفعيل');document.getElementById('pay').classList.remove('open');upd()}else alert('الكود غالط')}
function smartAnswer(q){let qq=q.toLowerCase();if(qq.includes('سلم')||qq.includes('سلام')||qq.includes('slm'))return 'وعليكم السلام ورحمة الله! 👋 مرحبا بيك - أنا فاهم بلان ديالك. سولني: فين الصالون؟ فين الكوزينة؟ شحال من بيت؟';if(qq.includes('كوزين')||qq.includes('مطبخ')||qq.includes('kozina'))return 'الكوزينة كاينة على اليمين حدا باب الدخلة 🍳 فيها بلاصة الطبخ والثلاجة وقريبة للصالون.';if(qq.includes('صالون')||qq.includes('salon'))return 'الصالون هو أكبر بيت، كاين فالوسط قدام الدخلة 🛋️ فيه شرجم كبير.';if(qq.includes('بيت')||qq.includes('نعاس'))return 'كاين جوج بيوت نعاس الفوق 🛏️ الرئيسي كبير فيه بلاكار والثاني حداه.';if(qq.includes('حمام')||qq.includes('دوش'))return 'الحمام فالكولوار على اليمين 🚿 فيه دوش وطواليط.';if(qq.includes('باب')||qq.includes('دخلة'))return 'باب الدخلة فالتحت على اليسار 🚪 كيدخلك لكولوار كيفرق للبيوت.';return 'فهمتك! 👍 هاد البلان فيه: صالون واسع فالوسط، جوج بيوت نعاس الفوق، كوزينة على اليمين، وحمام فالكولوار. سولني: فين الصالون؟';}
function ask(){let q=document.getElementById('qInput').value.trim();if(!q)return;if(!isPro()&&getUsed()>=20){document.getElementById('pay').classList.add('open');return}let box=document.getElementById('chatMsgs');let m=document.createElement('div');m.className='m u';m.innerText=q;box.appendChild(m);document.getElementById('qInput').value='';if(!isPro())setUsed(getUsed()+1);let ans=smartAnswer(q);let mm=document.createElement('div');mm.className='m ai';mm.innerText=ans;box.appendChild(mm);speakText(ans);}
function handle(inp){if(!inp.files[0])return;if(!currentEmail){alert('دخل بجيمايل');return}if(!isPro()&&getUsed()>=20){document.getElementById('pay').classList.add('open');return}let file=inp.files[0];document.getElementById('planPreview').src=URL.createObjectURL(file);if(!isPro())setUsed(getUsed()+1);setTimeout(()=>{document.getElementById('resTitle').innerText="بلان ديال دار صغيرة";let sl=document.getElementById('stepsList');sl.innerHTML="";["باب الدخلة الرئيسي فالتحت","الكوزينة على اليمين حدا الدخلة","الصالون واسع فالوسط","جوج بيوت نعاس الفوق","الحمام على اليمين فالكولوار"].forEach((t,i)=>{let d=document.createElement('div');d.className='step';d.innerHTML=`<div class="num">${i+1}</div><div><b>الخطوة ${i+1}</b> - ${t}</div>`;sl.appendChild(d)});document.getElementById('uploadView').style.display='none';document.getElementById('resultView').style.display='block';let chat=document.getElementById('chatMsgs');chat.innerHTML="";let mm=document.createElement('div');mm.className='m ai';mm.innerText="✅ حللت البلان! دابا سولني: سلم؟ فين الصالون؟ فين الكوزينة؟";chat.appendChild(mm);speakText("حللت البلان!");},1200)}upd();
</script></body></html>
