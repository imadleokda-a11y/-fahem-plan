<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>البلان ولى ساهل تفهمو</title><style>body{background:#1a2340;color:white;font-family:sans-serif;text-align:center;padding:20px} .box{border:2px dashed #666;border-radius:20px;padding:30px;margin:20px 0} .btn{background:#f97316;color:white;padding:15px;border:none;border-radius:20px;width:100%;font-weight:bold} #result{background:white;color:black;border-radius:15px;padding:15px;margin-top:20px;display:none;white-space:pre-wrap;text-align:right}</style></head><body><h1>البلان ولى <span style="color:#f97316">ساهل</span> تفهمو</h1><p>صوّر البلان ويفهمك بالدارجة</p><div class="box" onclick="document.getElementById('file').click()"><div id="txt">📷 كليكي هنا باش تصور البلان</div><img id="prev" style="display:none;width:100%;margin-top:10px;border-radius:10px"><input type="file" id="file" accept="image/*" style="display:none"></div><div id="loading" style="display:none">كنحلل...</div><div id="result"></div><a href="https://wa.me/212647205383"><button class="btn">واتساب 0647205383</button></a><script>let b64=null;document.getElementById('file').addEventListener('change',e=>{let f=e.target.files[0];let r=new FileReader();r.onload=ev=>{b64=ev.target.result;document.getElementById('prev').src=ev.target.result;document.getElementById('prev').style.display='block';document.getElementById('txt').style.display='none';document.getElementById('result').style.display='block';document.getElementById('result').innerText='الصورة تلصقات! دابا خاصنا نزيدو مفتاح Gemini. قول ليا باش نكملو';};r.readAsDataURL(f)});</script></body></html>
