<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاهم بلان - كلشي ساهل</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Tajawal',sans-serif;}</style>
</head>
<body class="bg-[#0a1931] text-white min-h-screen relative overflow-x-hidden">
<div class="absolute inset-0" style="background-image:linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px); background-size:40px 40px;"></div>

<div class="relative p-3">
<div class="bg-white/10 backdrop-blur-md border border-white/15 rounded-full px-6 py-3 flex justify-between items-center max-w-6xl mx-auto">
<div class="flex gap-6 text-sm opacity-80"><a href="#learn">تعلم</a><a href="#scan">صوّر بلان</a></div>
<div class="flex items-center gap-3"><div><div class="font-black text-xl leading-none">فاهم بلان</div><div class="text-[10px] opacity-60 tracking-widest">FAHEM PLAN AI</div></div><div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-blue-900">◫</div></div>
</div>
</div>

<div class="relative max-w-6xl mx-auto px-6 pt-10 md:pt-16 text-center">
<div class="inline-flex bg-white/10 border border-white/20 rounded-full px-5 py-1.5 text-xs gap-2 mb-8"><span>Français</span>·<span>English</span>·<span>عربي</span>·<span>بالدارجة المغربية</span></div>
<h1 class="text-[42px] md:text-[84px] font-black leading-[0.85] mb-6">البلان ولّى<br><span>ساهل <span class="text-[#FF8C32]">تفهمو</span></span></h1>
<p class="text-white/60 text-[17px] leading-8 max-w-[560px] mx-auto mb-12">صوّر البلان ديال الدار ديالك، وفاهم بلان يشرح ليك<br>كل بيت، كل باب، كل قياس وكل رمز... بحال إلا<br>كيهضر معاك صاحبك المهندس.</p>

<div class="grid grid-cols-3 gap-3 max-w-[640px] mx-auto mb-8">
<div onclick="goScan()" class="bg-white/[0.07] border border-white/15 rounded-[20px] p-6 cursor-pointer hover:bg-white/10 transition"><div class="text-3xl mb-3">📷</div><div class="text-[15px]">صوّر بلانك</div></div>
<div class="bg-white/[0.07] border border-white/15 rounded-[20px] p-6"><div class="text-3xl mb-3">🎓</div><div class="text-[15px] leading-5">تعلم تقرا 📚<br>البلان</div></div>
<div class="bg-white/[0.07] border border-white/15 rounded-[20px] p-6"><div class="text-3xl mb-3">💰</div><div class="text-[15px] leading-5">أثمنة مواد<br>البناء</div></div>
</div>

<div class="flex flex-col md:flex-row gap-3 justify-center max-w-[640px] mx-auto">
<button class="bg-white/10 border border-white/20 rounded-full px-8 py-4 text-[15px]">تعلم من الصفر 🎓</button>
<button onclick="goScan()" class="bg-[#FF8C32] rounded-full px-10 py-4 font-bold">صوّر بلان دابا 📷</button>
</div>

<div id="result" class="hidden mt-10 bg-white text-black rounded-[24px] p-6 max-w-[640px] mx-auto text-right"></div>
<input type="file" id="fileInput" hidden accept="image/*">
</div>

<script>
function goScan(){document.getElementById('fileInput').click()}
document.getElementById('fileInput').onchange = e=>{
 const file = e.target.files[0];
 if(!file) return;
 const r = document.getElementById('result');
 r.classList.remove('hidden');
 r.innerHTML = `✅ تم تحميل البلان: <b>${file.name}</b><br><br>🏠 فاهم بلان كيقرا ليك دابا...<br><br>• المساحة: ~120m²<br>• 3 بيوت + صالون + كوزينة<br>• القياسات واضحة<br><br><i>هادي نسخة تجريبية بلا علامة مائية - تقدر تزيد عليها الذكاء الاصطناعي الحقيقي من بعد</i>`;
 r.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
