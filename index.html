<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاهم بلان v66</title>
<style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#f1f5f9}
header{padding:12px;text-align:center;background:#1e293b;border-bottom:2px solid #38bdf8}
.container{max-width:700px;margin:auto;padding:12px}
.card{background:#1e293b;border-radius:14px;padding:12px;margin-bottom:12px;border:1px solid #334155}
.btn{background:#38bdf8;color:#0f172a;border:0;padding:12px;border-radius:10px;font-weight:bold;cursor:pointer;width:100%;font-size:16px}
.msg{padding:10px;border-radius:10px;margin:8px 0;white-space:pre-wrap}
.user{background:#334155;text-align:left}
.ai{background:#0e7490;border:1px solid #22d3ee}
#messages{max-height:55vh;overflow:auto}
textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white;box-sizing:border-box}
.counter{border:2px solid #22c55e;border-radius:10px;padding:8px;text-align:center;font-weight:bold;margin-bottom:10px}
.premium{background:linear-gradient(135deg,#f59e0b,#ef4444);color:white;padding:16px;border-radius:14px;text-align:center}
</style>
</head>
<body>
<header><h2 style="margin:0">فاهم بلان v66 🏗️ - ذكاء حقيقي</h2></header>
<div class="container">
<div class="counter" id="counter">جاري التحميل...</div>
<div class="card">
<div id="messages"><div class="msg ai">مرحبا عماد! v66 واجد 100%! ✅
عندك 20 سؤال فابور. سول: شحال السيما ل 100 متر؟</div></div>
<textarea id="userInput" placeholder="كتب سؤالك هنا..."></textarea>
<button class="btn" id="sendBtn" onclick="send()" style="margin-top:8px">إرسال 🚀</button>
</div>
<div id="premiumBox" style="display:none" class="card premium">
<h3>ساليتي 20!</h3>
<a id="waLink" href="#" class="btn" style="background:#25D366;color:white">واتساب 06 47 20 53 83</a>
</div>
</div>
<script>
const API_KEY = "AQ.Ab8RN6JiBlXyPowqu2ZTlF-NPhfFspWbOMbR7bVvJ2wcu6bARQ";
const FREE_LIMIT = 20;
const WHATSAPP = "212647205383";
function todayKey(){return "fahem_v66_"+new Date().toISOString().slice(0,10);}
function getCount(){var v=localStorage.getItem(todayKey());if(!v)return 0;return parseInt(v);}
function incCount(){localStorage.setItem(todayKey(), (getCount()+1).toString()); updateCounter();}
function updateCounter(){
 var c=getCount();
 var r=FREE_LIMIT-c;
 var el=document.getElementById("counter");
 var box=document.getElementById("premiumBox");
 if(r>0){
  el.innerHTML="🎁 باقي ليك "+r+" سؤال فابور - استعملتي "+c+" / "+FREE_LIMIT;
  box.style.display="none";
 }else{
  el.innerHTML="⛔ ساليتي "+FREE_LIMIT+" - بغيتي تكمل؟";
  box.style.display="block";
  var code=Math.random().toString(36).slice(2,8).toUpperCase();
  var msg="السلام عماد، ساليت 20، بغيت 1000، الكود:"+code;
  document.getElementById("waLink").href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg);
 }
}
updateCounter();
function addMsg(t,cls){
 var m=document.getElementById("messages");
 var d=document.createElement("div");
 d.className="msg "+cls;
 d.textContent=t;
 m.appendChild(d);
 m.scrollTop=m.scrollHeight;
}
async function send(){
 if(getCount()>=FREE_LIMIT){updateCounter();addMsg("⛔ ساليتي 20! بغيتي 1000؟","ai");return;}
 var txt=document.getElementById("userInput").value.trim();
 if(!txt)return;
 addMsg(txt,"user");
 document.getElementById("userInput").value="";
 var btn=document.getElementById("sendBtn");
 btn.disabled=true; btn.innerText="كيجاوب...";
 try{
  var url="https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+API_KEY;
  var body={contents:[{parts:[{text:"أنت خبير بناء مغربي، جاوب بالدارجة المغربية باختصار مع أرقام. سؤال: "+txt}]}]};
  var res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  var data=await res.json();
  if(data.error){
   // جرب موديل آخر
   var url2="https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+API_KEY;
   var res2=await fetch(url2,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
   var data2=await res2.json();
   if(data2.error){addMsg("خطأ: "+data.error.message+" / "+data2.error.message,"ai");}
   else{var ans=data2.candidates[0].content.parts[0].text;addMsg(ans,"ai");incCount();}
  }else{
   var ans=data.candidates[0].content.parts[0].text;
   addMsg(ans,"ai");incCount();
  }
 }catch(e){addMsg("خطأ: "+e.message,"ai");}
 btn.disabled=false; btn.innerText="إرسال 🚀";
}
</script>
</body>
</html>
