<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاهم بلان</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0f172a;color:#fff;font-family:system-ui;padding:16px}.c{max-width:480px;margin:auto}.h{font-size:38px;font-weight:900;text-align:center}.h span{color:#fb923c}.p{text-align:center;color:#94a3b8;margin:12px 0;font-size:13px}.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.k{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:14px;text-align:center;cursor:pointer}.r{display:flex;gap:8px;margin:14px 0}.b{flex:1;padding:14px;border-radius:999px;border:1px solid #334155;background:#1e293b;color:#fff;font-weight:700}.b.o{background:#fb923c;color:#000}#app{background:#fff;color:#000;border-radius:20px;padding:16px;margin-top:16px}.up{display:block;border:2px dashed #fb923c;border-radius:14px;padding:22px;text-align:center;background:#fff7ed;cursor:pointer;font-weight:700}.msg{padding:10px 12px;border-radius:12px;margin:6px 0;font-size:13px;max-width:90%}.msg.u{background:#fb923c;color:#000;margin-left:auto}.msg.ai{background:#f1f5f9}.speak{background:#22c55e;color:#fff;border:0;border-radius:999px;padding:10px;width:100%;font-weight:700;margin:6px 0}</style></head><body><div class="c"><div class="h">البلان ولّى<br><span>ساهل</span> تفهمو</div><div class="p">صوّر البلان ديال دارك، نشرحو ليك بالدارجة.</div><div class="g"><div class="k" onclick="openApp()"><div>📷</div><div style="font-size:11px">صوّر بلانك</div></div><div class="k" onclick="showLearn()"><div>🎓</div><div style="font-size:11px">تعلم تقرا البلان</div></div><div class="k" onclick="showPrices()"><div>💰</div><div style="font-size:11px">أثمنة مواد البناء</div></div></div><div class="r"><button class="b o" onclick="openApp()">📷 صوّر بلان دابا</button><button class="b" onclick="showLearn()">🎓 تعلم من الصفر</button></div><div id="app"><h3>📷 فاهم بلان - <span id="cnt"></span></h3><label class="up" for="f">📷 كليكي هنا باش تصوّر البلان</label><input type="file" id="f" accept="image/*" style="display:none" onchange="sendImg(this)"><div id="msgs" style="margin-top:12px"></div></div></div><script>
const DEFAULT_KEY = "AQ.Ab8RN6KwKbhYsFJ9yBp7ic206ZjqyeszDgpLb-lYr-QWwvRKRA";
let used=parseInt(localStorage.getItem('fb_used')||'0');
function upd(){document.getElementById('cnt').innerText='باقي: '+(20-used)+' / 20 مجانا';}
function openApp(){document.getElementById('app').scrollIntoView({behavior:'smooth'});upd()}
function add(t,c){const d=document.getElementById('msgs');const m=document.createElement('div');m.className='msg '+(c==='u'?'u':'ai');m.innerText=t;d.appendChild(m);d.scrollTop=d.scrollHeight;return m}
function showLearn(){openApp();add('🎓 تعلم من الصفر:','ai');add('1- الخطوط الغلاض = الحيطان\n2- المربعات = البيبان\n3- الصالة اكبر بيت\nصوّر بلان ونوريك!','ai')}
function showPrices(){openApp();add('💰 أثمنة مواد البناء: سيما 32درهم، حديد 7200/طن، رملة 200/طن','ai')}
function speakText(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar';u.rate=0.95;speechSynthesis.speak(u)}
async function sendImg(i){if(!i.files[0])return;if(used>=20){add('⛔ وصلتي 20 رسالة فابور!','ai');return}const r=new FileReader();r.onload=async()=>{const b64=r.result.split(',')[1];add('صورت البلان، كنقرا فيه دابا...','u');used++;localStorage.setItem('fb_used',used);upd();try{const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key='+DEFAULT_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'اشرح هذا المخطط المعماري بالدارجة المغربية ببساطة'},{inline_data:{mime_type:i.files[0].type,data:b64}}]}]})});const j=await res.json();const txt=j.candidates?.[0]?.content?.parts?.[0]?.text||j.error?.message||'ما قدرتش نقرا.';add(txt,'ai');const btn=document.createElement('button');btn.className='speak';btn.innerText='🔊 سمع الشرح';btn.onclick=()=>speakText(txt);document.getElementById('msgs').appendChild(btn);speakText(txt.slice(0,300));}catch(e){add('مشكل: '+e,'ai')}};r.readAsDataURL(i.files[0])}
upd();
</script></body></html>
